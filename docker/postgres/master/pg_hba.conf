# pg_hba.conf for master node
# Разрешает: локальные подключения + подключения приложения + репликационные подключения слейвов

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Локальные подключения (unix socket)
local   all             all                                     trust

# Локальные TCP подключения
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5

# Подключения из Docker-сети (приложение + слейвы)
host    all             all             0.0.0.0/0               md5

# Репликационные подключения — replicator user из любого адреса Docker-сети
host    replication     replicator      0.0.0.0/0               md5
