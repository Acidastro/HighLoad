# PostgreSQL configuration for master node (streaming replication)
# Применяется к контейнеру social_network_master

# ---------------------------------------------------------------------------
# CONNECTIONS
# ---------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 200

# ---------------------------------------------------------------------------
# WAL (Write-Ahead Log) — основа streaming replication
# ---------------------------------------------------------------------------
wal_level = replica            # Минимальный уровень для репликации
max_wal_senders = 10           # Максимум одновременных replication-соединений
wal_keep_size = 256MB          # Сколько WAL хранить для слейвов
wal_log_hints = on             # Нужно для pg_rewind

# ---------------------------------------------------------------------------
# REPLICATION — PHASE 1: Асинхронная (baseline для замеров)
# ---------------------------------------------------------------------------
synchronous_commit = off       # Не ждём подтверждения от слейвов

# ---------------------------------------------------------------------------
# REPLICATION — PHASE 2: Синхронная кворумная (раскомментировать для теста)
# Кворум: подтверждение от ANY 1 из 2 слейвов перед коммитом
# ---------------------------------------------------------------------------
# synchronous_commit = on
# synchronous_standby_names = 'ANY 1 (slave1, slave2)'

# ---------------------------------------------------------------------------
# HOT STANDBY — позволяет слейвам обрабатывать read-only запросы
# ---------------------------------------------------------------------------
hot_standby = on

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_replication_commands = on
