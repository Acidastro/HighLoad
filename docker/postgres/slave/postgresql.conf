# PostgreSQL configuration for slave nodes (hot standby)
# Применяется к slave1 и slave2 контейнерам
# application_name переопределяется через primary_conninfo в entrypoint

# ---------------------------------------------------------------------------
# CONNECTIONS
# ---------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 200

# ---------------------------------------------------------------------------
# HOT STANDBY — слейв принимает read-only запросы
# ---------------------------------------------------------------------------
hot_standby = on
hot_standby_feedback = on      # Сообщаем мастеру о долгих запросах на слейве (избегаем конфликтов)

# ---------------------------------------------------------------------------
# REPLICATION (primary_conninfo задаётся через env PGPASSWORD и pg_basebackup)
# Параметры подключения к мастеру прописываются в entrypoint init-slave.sh
# через postgresql.auto.conf (ALTER SYSTEM или pg_basebackup --write-recovery-conf)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_connections = on
